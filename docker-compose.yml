version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examalert_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./examalert.db
      - JWT_SECRET=examalert_super_secret_jwt_key_2026_production
      - MONITOR_INTERVAL_MINUTES=60
    volumes:
      - ./backend/examalert.db:/app/examalert.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: examalert_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
